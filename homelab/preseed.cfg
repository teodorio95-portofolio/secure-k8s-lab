#### Debian 13 (trixie) unattended install for the homelab mini PC
#### (GMKtec NucBox M6 Ultra: Ryzen 5 7640HS, 32 GB DDR5, 1 TB NVMe).
#
# Boot the netinst USB -> "Advanced options" -> "Automated install", then give
# this file's raw URL when asked (see homelab/README.md).
#
# Result: a headless server with SSH only (no desktop), no swap (kubelet),
# the AMD iGPU firmware + Vulkan drivers, and a sudo user. Nothing secret lives
# here: the user password is asked interactively and never committed.
#
# WARNING: wipes /dev/nvme0n1 (the internal SSD, incl. the factory Windows).

### Localisation
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us

### Network (DHCP on the first wired interface)
# With "Automated install" the network comes up before this file is fetched,
# so the hostname answers below come too late; late_command sets it for real.
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string homelab
d-i netcfg/get_domain string lan
d-i netcfg/hostname string homelab
d-i hw-detect/load_firmware boolean true

### Mirror
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

### Accounts: no root login (the user gets sudo instead).
# The password is deliberately NOT set here; the installer asks for it.
d-i passwd/root-login boolean false
d-i passwd/user-fullname string Teodor
d-i passwd/username string teodorio

### Clock
d-i clock-setup/utc boolean true
d-i time/zone string Europe/Bucharest
d-i clock-setup/ntp boolean true

### Partitioning: GPT/UEFI, EFI system partition + one ext4 root, no swap
# (kubelet refuses to start with swap on by default).
d-i partman-auto/disk string /dev/nvme0n1
d-i partman-auto/method string regular
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true
d-i partman-partitioning/choose_label select gpt
d-i partman-partitioning/default_label string gpt
d-i partman-auto/expert_recipe string                     \
      homelab ::                                          \
        538 538 1075 free                                 \
          $iflabel{ gpt }                                 \
          $reusemethod{ }                                 \
          method{ efi }                                   \
          format{ } .                                     \
        20000 30000 -1 ext4                               \
          method{ format } format{ }                      \
          use_filesystem{ } filesystem{ ext4 }            \
          mountpoint{ / } .
d-i partman-auto/choose_recipe select homelab
d-i partman-basicfilesystems/no_swap boolean false
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true
# Only asked if the stick was booted in legacy/CSM mode (boot it in UEFI mode).
d-i partman-efi/non_efi_system boolean true

### Packages: SSH server + standard utilities only (no desktop).
d-i apt-setup/non-free-firmware boolean true
d-i apt-setup/services-select multiselect security, updates
tasksel tasksel/first multiselect standard, ssh-server
# - firmware-amd-graphics, mesa-vulkan-drivers, vulkan-tools: Radeon 760M iGPU
#   (Jellyfin VAAPI transcoding, llama.cpp/Ollama Vulkan later)
# - firmware-realtek: the RTL8125 2.5G NICs
# - git: clone this repo to run homelab/bootstrap-host.sh
d-i pkgsel/include string sudo curl ca-certificates git rsync \
    amd64-microcode firmware-amd-graphics firmware-realtek \
    mesa-vulkan-drivers vulkan-tools lm-sensors unattended-upgrades
d-i pkgsel/upgrade select full-upgrade
d-i pkgsel/update-policy select unattended-upgrades
popularity-contest popularity-contest/participate boolean false

### Bootloader
d-i grub-installer/only_debian boolean true
d-i grub-installer/bootdev string default

### Hostname (see the note under Network), then reboot (remove the USB stick).
d-i preseed/late_command string \
    echo homelab > /target/etc/hostname; \
    sed -i 's/^127\.0\.1\.1.*/127.0.1.1\thomelab.lan homelab/' /target/etc/hosts
d-i finish-install/reboot_in_progress note
