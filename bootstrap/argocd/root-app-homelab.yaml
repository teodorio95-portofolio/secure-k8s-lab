# App-of-apps for the homelab mini PC (bare-metal k3s instead of k3d).
# Same tree as root-app.yaml, with three differences:
#   1. it reads this repo from GitHub on the `homelab` branch (switch
#      targetRevision to HEAD once the branch is merged),
#   2. apps/argocd-apps/secure-ai-gateway.yaml and runtime-security.yaml are
#      swapped for their homelab variants in apps/homelab/ (bigger local model
#      sized for 32 GB; Falco without the juice-shop L7 policies), and
#   3. juice-shop.yaml is left out: no intentionally vulnerable target on the
#      home network.
# Applied by `make homelab-up`.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://github.com/teodorio95-portofolio/secure-k8s-lab.git
      targetRevision: homelab
      path: apps/argocd-apps
      directory:
        exclude: '{secure-ai-gateway.yaml,runtime-security.yaml,juice-shop.yaml}'
    - repoURL: https://github.com/teodorio95-portofolio/secure-k8s-lab.git
      targetRevision: homelab
      path: apps/homelab
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
