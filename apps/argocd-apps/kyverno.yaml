# Kyverno admission controller — installed from the upstream Helm chart.
# Heavy off-the-shelf infra => consume upstream chart (vs. our own for the app).
# sync-wave -2: must be Healthy before the policies (wave -1) are applied.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://kyverno.github.io/kyverno/
    chart: kyverno
    targetRevision: 3.8.1
    helm:
      values: |
        # Lightweight footprint for a local k3d lab.
        admissionController:
          replicas: 1
        backgroundController:
          replicas: 1
        cleanupController:
          replicas: 1
        reportsController:
          replicas: 1
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Kyverno CRDs exceed the client-side last-applied annotation limit.
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
  # The API server / Kyverno add fields to these CRDs that the chart doesn't
  # declare (an empty metadata.labels map and per-version selectableFields).
  # The chart also renders `annotations: {}` on the 11 *.policies.kyverno.io
  # CRDs; the API server drops the empty map, so without the third rule those
  # CRDs (and the app) stay OutOfSync forever. The select() ignores only an
  # empty map: real annotation changes are still diffed.
  # ServerSideApply is required: these CRDs exceed the client-side
  # last-applied annotation size limit.
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jqPathExpressions:
        - .metadata.labels
        - .spec.versions[].selectableFields
        - .metadata.annotations | select(. == {})
